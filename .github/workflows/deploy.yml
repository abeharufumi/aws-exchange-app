name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: my-site-image
  ECS_CLUSTER: my-site-cluster
  ECS_SERVICE: my-site-service
  ECS_TASK_FAMILY: my-site-task
  APP_ENV: production
  # SECRET_KEY等はECSタスク定義側、または後続のPythonスクリプト内で解決させる

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # TODO: AWS側でOIDCプロバイダを設定し、作成したRoleのARNをシークレット等で指定してください
          # role-to-assume: arn:aws:iam::611410719225:role/GitHubActionsECSRole

          # 代わりにアクセスキーを使用する場合は以下のコメントアウトを外し、リポジトリシークレットに登録してください
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./backend
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:aws-exchange-app-$IMAGE_TAG"
          docker build --platform linux/amd64 -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3 (for deployment script)
        run: pip install boto3

      - name: Update ECS Service Definition and Force Deployment
        working-directory: ./backend
        run: |
          python scripts/deploy_ecs.py
